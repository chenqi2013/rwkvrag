[unix_http_server]
file=/workspace/rwkvrag-data/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/rwkvrag-data/logs/supervisord.log
pidfile=/workspace/rwkvrag-data/run/supervisord.pid
childlogdir=/workspace/rwkvrag-data/logs
minfds=65535
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/rwkvrag-data/run/supervisor.sock

[program:mongodb]
command=/workspace/mongodb-8.0.12/bin/mongod --dbpath /workspace/rwkvrag-data/mongodb --bind_ip 127.0.0.1 --port 27017 --logpath /workspace/rwkvrag-data/logs/mongodb.log --logappend
user=mark
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rwkvrag-data/logs/mongodb-supervisor.log

[program:opensearch]
command=/workspace/opensearch-3.7.0/bin/opensearch
directory=/workspace/opensearch-3.7.0
user=mark
priority=20
autostart=true
autorestart=true
startsecs=30
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=OPENSEARCH_JAVA_OPTS="-Xms16g -Xmx16g"
redirect_stderr=true
stdout_logfile=/workspace/rwkvrag-data/logs/opensearch-supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:rwkvrag]
command=/workspace/rwkvrag/llamaindex-retrieval/.venv/bin/rwkvrag-retrieval serve --host 0.0.0.0 --port 8090
directory=/workspace/rwkvrag/llamaindex-retrieval
user=mark
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PYTHONSAFEPATH="1",NLTK_DISABLE_IMPORT_SECURITY="1",RWKVRAG_LIST_QUERY_MAX_CHUNKS_PER_DOCUMENT="10"
redirect_stderr=true
stdout_logfile=/workspace/rwkvrag-data/logs/rwkvrag.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
