[project]
name = "rwkvrag-llamaindex-retrieval"
version = "0.2.0"
description = "Evidence retrieval API built with LlamaIndex, Qwen3 Embedding, and Qdrant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "llama-index-core>=0.13,<0.15",
  "llama-index-embeddings-openai>=0.5,<0.7",
  "llama-index-vector-stores-qdrant>=0.9,<0.11",
  "pymongo>=4.12,<5",
  "pymupdf>=1.25,<2",
  "pyarrow>=18,<26",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.16,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
rerank = [
  "llama-index-postprocessor-sbert-rerank>=0.4,<0.6",
  "sentence-transformers>=5.1,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
rwkvrag-retrieval = "llamaindex_retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llamaindex_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
